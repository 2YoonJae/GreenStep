# GreenStep — 브라우저 → nginx(:80) → (정적 파일 | /api/ → FastAPI :8000)

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 정적 리소스 캐시 (Vite 빌드 결과는 파일명에 해시 포함)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API 프록시 — FastAPI(backend:8000)
    # resolver + 변수: backend 컨테이너가 늦게 떠도 nginx 가 시작되도록 요청 시점에 이름 확인
    location /api/ {
        resolver           127.0.0.11 valid=10s;
        set $api           http://backend:8000;
        proxy_pass         $api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 10m;   # 1365 활동확인서 업로드
    }

    # SPA 라우팅 (react-router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
